# Beria: K-module study on held-out 118234, all 11 modules evaluated.
# Full statistics: K=1,3,6 (K=11 is beria_nozs_118234). Equal event budget (fraction 1/K): K=3,6,11 (K=1 is the same as full).
analyses:
  - config: ../configs/kmodule_k1_118234.yaml
    steps: [plots, multimodule_plot]
  - config: ../configs/kmodule_k3_118234.yaml
    steps: [plots, multimodule_plot]
  - config: ../configs/kmodule_k6_118234.yaml
    steps: [plots, multimodule_plot]
  - config: ../configs/kmodule_k3_equalevents_118234.yaml
    steps: [plots, multimodule_plot]
  - config: ../configs/kmodule_k6_equalevents_118234.yaml
    steps: [plots, multimodule_plot]
  - config: ../configs/kmodule_k11_equalevents_118234.yaml
    steps: [plots, multimodule_plot]
max_jobs: 4
max_io_jobs: 2
max_gpu_jobs: 1
